# Canonical Dependabot config for the WYRE-AI *-mcp / node-* fleet.
#
# Goal: keep PR volume manageable for a small team. Updates are GROUPED so a
# repo gets a handful of PRs per week instead of one-per-package, and the
# dependabot-janitor (daily) auto-merges the green grouped PRs. Only
# PRODUCTION-dependency MAJOR bumps land as individual PRs for human review,
# since those can carry behavioural breaking changes a green test suite misses.
#
version: 2

# No private registry: all dependencies (including the exact-pinned
# @acronis-platform/mcp) come from public npm.
#
# PINNING POLICY (WYREAI-711): @acronis-platform/mcp is pinned to an EXACT
# version and the sha256 of every file it runs (scripts/upstream-pin.json). It
# has no source repo and no provenance, so Dependabot is told to ignore it
# entirely: no bump PR exists for it. A bump is a manual PR with a human diff of
# the new bundle (see README "Upstream pinning").
#
# That is all this file does. It does NOT stop other automation from merging:
# the org-level dependabot-janitor (not in this repo) auto-merges green grouped
# PRs, and the github-actions and docker groups below change /.github and
# /Dockerfile, which hold the pin check, the egress guard copy and the image
# hardening (both are CODEOWNERS paths). Until the maintainer actions in README
# "Required maintainer actions" are done (Code Owners review required, required
# status checks, the janitor excluded from /.github and /Dockerfile), a bot can
# change those files without a human looking at them.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      # All dev/CI tooling (eslint, vitest, typescript, @types/*, etc.) incl.
      # majors → ONE PR. The janitor auto-merges it when CI is green.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["major", "minor", "patch"]
      # Production minor + patch → ONE PR. Auto-merged when green.
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
        exclude-patterns: ["@acronis-platform/mcp"]
    # Production MAJORS are intentionally NOT grouped → individual PRs, held for
    # human review (never auto-merged).
    ignore:
      # Never propose a bump of the unauditable upstream bundle (see top of file).
      - dependency-name: "@acronis-platform/mcp"
      # typescript 7.x breaks this fleet's toolchain: DTS emit (tsup/rollup-plugin-dts
      # TS5101 baseUrl-deprecated-as-error), and typescript-eslint (still <6.1.0 as of
      # 8.66.0, no TS7 support yet). Has broken main 3x on some repos because Dependabot
      # has no memory of a prior manual revert and just re-proposes the same major again.
      # Deliberate hold, not a permanent blind -- remove once typescript-eslint + the
      # tsup/DTS toolchain support TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]
