name: Test

on:
  pull_request:
    branches:
      - main
      - next
      - next-major
      - beta
      - alpha

# Every dependency comes from the public npm registry, so no job needs a
# registry token. Read-only token for checkout only.
permissions:
  contents: read

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify upstream pin (version, integrity, file sha256)
        run: npm run verify-upstream

      - name: Run linter
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # WYREAI-711: the pool is sized from measured peaks. Runs alone, after the
      # other tests, so it has the CPU to itself, and prints the numbers.
      - name: Sustained-load memory check
        run: npm run test:load

      - name: Test Docker build
        run: docker build -t acronis-mcp:test .

      # WYREAI-711: the app user (which the upstream children also run as) must
      # not be able to rewrite the pinned bundle, the egress guard or the wrapper.
      - name: Image is read-only for the app user
        run: |
          docker run --rm --entrypoint sh acronis-mcp:test -c '
            test "$(id -u)" != 0 || { echo "runs as root"; exit 1; }
            test -r /app/child-egress-guard.cjs || { echo "guard not readable"; exit 1; }
            for f in /app/child-egress-guard.cjs /app/dist/index.js /app/node_modules/@acronis-platform/mcp/bin/cli.js /app/node_modules/@acronis-platform/mcp/dist/bundle.js; do
              if ( : >> "$f" ) 2>/dev/null; then echo "writable: $f"; exit 1; fi
            done
            if touch /app/new-file 2>/dev/null; then echo "/app is writable"; exit 1; fi
            echo "read-only as expected"'

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify upstream pin (version, integrity, file sha256)
        run: npm run verify-upstream

      - name: Run linter
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm test
