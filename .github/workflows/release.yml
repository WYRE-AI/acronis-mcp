name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline. The build →
# semantic-release → Docker → MCP Registry → security chain (tag-based release
# detection + correct gating) lives in the public WYRE-AI/reusable-workflows repo so every *-mcp
# repo stays in lockstep instead of drifting per-repo. Caller jobs grant the
# token scopes the reusable jobs request (a reusable can only reduce, never
# expand, caller-granted scope).
jobs:
  release:
    permissions:
      actions: read # Security Scan: SARIF upload reads run metadata on a private repo
      contents: write
      issues: write
      pull-requests: write # @semantic-release/github success step reads/comments on PRs
      packages: write
      id-token: write
      security-events: write
    # WYRE-AI/reusable-workflows#3 merge commit (private-repo-safe Security Scan and
    # MCP Registry publish).
    uses: WYRE-AI/reusable-workflows/.github/workflows/mcp-server-release.yml@508ef4ddcd19285d108423a27f44078a15451575
    with:
      server-name: acronis-mcp
      image-name: ghcr.io/wyre-ai/acronis-mcp
      # This repo is private: the reusable skips the public MCP Registry
      # publish and skips the SARIF upload while Code Security is off. The
      # Trivy scan still runs and fails the job on these severities.
      fail-on-severity: HIGH,CRITICAL
    secrets: inherit

# NO `deploy:` job — deliberate, matching the connectwise-cpq-mcp precedent.
#
# The fleet-standard `mcp-server-deploy.yml` deploys to `gwp-<slug>` in the
# `mcp-gateway-prod` resource group — the separate legacy fleet — NOT conduit.
# No `gwp-acronis` Container App and no federated identity credential for this
# repo exist yet, so that job would only fail (AADSTS7002131). Conduit's own
# sidecars are deployed separately from `azure/vendor-fleet.conduit-prod.bicepparam`
# by conduit's `deploy-vendor-fleet.yml` — see the mcp-vendor-scaffolding skill
# §3.3. Add a `deploy:` job here only after that infra exists for this repo.
